<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="title desc">
  <title id="title">Supported Languages section header</title>
  <desc id="desc">Supported Languages section header with globe/language motif</desc>

  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="#0d1117"/>

  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2"/>

  <g transform="translate(64 28)">
    <!-- Globe/language icon -->
    <g transform="translate(0 10)" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="18"/>
      <path d="M20 2 L20 38 M2 20 L38 20"/>
      <path d="M20 20 L32 8 M20 20 L32 32 M8 8 L20 20 M8 32 L20 20"/>
    </g>

    <text x="56" y="30"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="36" font-weight="700" fill="#e6edf3">
      Supported Languages
    </text>

    <text x="56" y="72"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="16" font-weight="400" fill="#8b949e">
      39 languages — from Afrikaans to Vietnamese
    </text>
  </g>

  <line x1="64" y1="112" x2="560" y2="112" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4"/>
</svg>