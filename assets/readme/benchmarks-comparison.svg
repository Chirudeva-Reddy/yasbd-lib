<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="title desc">
  <title id="title">Benchmark Results: Accuracy & Speed Comparison</title>
  <desc id="desc">Horizontal bar chart comparing yasbd-lib vs 6 competitors on accuracy (F1) and speed</desc>

  <defs>
    <linearGradient id="yasbdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="competitorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#484f58"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7813a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="48"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
        font-size="28" font-weight="700" fill="#e6edf3" text-anchor="middle">
    Benchmark: Accuracy & Speed vs. 6 Competitors
  </text>

  <text x="600" y="76"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
        font-size="14" fill="#8b949e" text-anchor="middle">
    Golden benchmark (92 English edge cases) · Warm throughput on 594k chars
  </text>

  <!-- Accuracy Chart (F1) -->
  <g transform="translate(80 110)">
    <text x="0" y="0"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="18" font-weight="600" fill="#e6edf3">
      Boundary-Level F1 Score (higher is better)
    </text>

    <!-- Bars -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <!-- yasbd -->
      <rect x="0" y="36" width="580" height="32" rx="4" fill="url(#yasbdGrad)"/>
      <text x="16" y="56" font-weight="600" fill="#0d1117">yasbd</text>
      <text x="600" y="56" font-weight="700" fill="#3fb950" text-anchor="end">99.7%</text>

      <!-- pysbd -->
      <rect x="0" y="76" width="547" height="32" rx="4" fill="url(#competitorGrad)"/>
      <text x="16" y="96" font-weight="600" fill="#e6edf3">pysbd</text>
      <text x="600" y="96" font-weight="600" fill="#8b949e" text-anchor="end">93.8%</text>

      <!-- sentencex -->
      <rect x="0" y="116" width="538" height="32" rx="4" fill="url(#competitorGrad)"/>
      <text x="16" y="136" font-weight="600" fill="#e6edf3">sentencex</text>
      <text x="600" y="136" font-weight="600" fill="#8b949e" text-anchor="end">92.1%</text>

      <!-- blingfire -->
      <rect x="0" y="156" width="525" height="32" rx="4" fill="url(#competitorGrad)"/>
      <text x="16" y="176" font-weight="600" fill="#e6edf3">blingfire</text>
      <text x="600" y="176" font-weight="600" fill="#8b949e" text-anchor="end">89.8%</text>

      <!-- sentsplit -->
      <rect x="0" y="196" width="512" height="32" rx="4" fill="url(#competitorGrad)"/>
      <text x="16" y="216" font-weight="600" fill="#e6edf3">sentsplit</text>
      <text x="600" y="216" font-weight="600" fill="#8b949e" text-anchor="end">87.4%</text>
    </g>
  </g>

  <!-- Speed Chart -->
  <g transform="translate(640 110)">
    <text x="0" y="0"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="18" font-weight="600" fill="#e6edf3">
      Warm Throughput (594k chars, lower is better)
    </text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <!-- yasbd -->
      <rect x="0" y="36" width="180" height="32" rx="4" fill="url(#speedGrad)"/>
      <text x="16" y="56" font-weight="600" fill="#0d1117">yasbd</text>
      <text x="520" y="56" font-weight="700" fill="#ff6b35" text-anchor="end">1.2 s</text>

      <!-- pysbd -->
      <rect x="0" y="76" width="520" height="32" rx="4" fill="url(#competitorGrad)"/>
      <text x="16" y="96" font-weight="600" fill="#e6edf3">pysbd</text>
      <text x="520" y="96" font-weight="600" fill="#8b949e" text-anchor="end">9.0 s</text>

      <!-- sentencex -->
      <rect x="0" y="116" width="320" height="32" rx="4" fill="url(#competitorGrad)"/>
      <text x="16" y="136" font-weight="600" fill="#e6edf3">sentencex</text>
      <text x="520" y="136" font-weight="600" fill="#8b949e" text-anchor="end">5.8 s</text>

      <!-- blingfire -->
      <rect x="0" y="156" width="100" height="32" rx="4" fill="url(#speedGrad)"/>
      <text x="16" y="176" font-weight="600" fill="#0d1117">blingfire</text>
      <text x="520" y="176" font-weight="600" fill="#ff6b35" text-anchor="end">0.8 s</text>

      <!-- sentsplit -->
      <rect x="0" y="196" width="400" height="32" rx="4" fill="url(#competitorGrad)"/>
      <text x="16" y="216" font-weight="600" fill="#e6edf3">sentsplit</text>
      <text x="520" y="216" font-weight="600" fill="#8b949e" text-anchor="end">7.2 s</text>
    </g>

    <!-- Legend -->
    <g transform="translate(0 250)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="url(#yasbdGrad)"/>
      <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#e6edf3">yasbd-lib (best accuracy)</text>

      <rect x="220" y="0" width="18" height="18" rx="3" fill="url(#speedGrad)"/>
      <text x="244" y="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#e6edf3">Fastest Python (blingfire is C++)</text>

      <rect x="520" y="0" width="18" height="18" rx="3" fill="url(#competitorGrad)"/>
      <text x="544" y="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#8b949e">Competitors</text>
    </g>
  </g>

  <!-- Bottom note -->
  <text x="600" y="400"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
        font-size="12" fill="#6e7681" text-anchor="middle">
    Full results: <a href="https://github.com/speedyk-005/yasbd-lib/tree/main/benchmarks" fill="#58a6ff">benchmarks/</a>  |  Accuracy: Precision 100% / Recall 99.3% / F1 99.7%
  </text>
</svg>