<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="title desc">
  <title id="title">Use Cases section header</title>
  <desc id="desc">Use Cases section header with scissors motif</desc>

  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="#0d1117"/>

  <!-- Decorative top border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Icon + Title -->
  <g transform="translate(64 28)">
    <!-- Scissors icon -->
    <g transform="translate(0 12)" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="6"/>
      <circle cx="36" cy="18" r="6"/>
      <path d="M24 24 L24 42 M12 24 L12 42"/>
      <path d="M18 42 L24 48 M30 42 L24 48"/>
    </g>

    <text x="56" y="30"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="36" font-weight="700" fill="#e6edf3">
      Use Cases
    </text>

    <text x="56" y="72"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="16" font-weight="400" fill="#8b949e">
      Where yasbd shines in real-world text processing
    </text>
  </g>

  <!-- Divider line -->
  <line x1="64" y1="112" x2="520" y2="112" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4"/>
</svg>