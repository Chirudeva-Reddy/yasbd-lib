<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="title desc">
  <title id="title">Benchmarks section header</title>
  <desc id="desc">Benchmarks section header with chart motif</desc>

  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7813a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="#0d1117"/>

  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2"/>

  <g transform="translate(64 28)">
    <!-- Chart/bar icon -->
    <g transform="translate(0 8)" fill="url(#accentGrad)">
      <rect x="0" y="36" width="14" height="28" rx="2"/>
      <rect x="22" y="20" width="14" height="44" rx="2"/>
      <rect x="44" y="8" width="14" height="56" rx="2"/>
      <rect x="66" y="24" width="14" height="40" rx="2"/>
      <rect x="88" y="4" width="14" height="60" rx="2"/>
      <rect x="110" y="28" width="14" height="36" rx="2"/>
    </g>

    <text x="56" y="30"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="36" font-weight="700" fill="#e6edf3">
      Benchmarks
    </text>

    <text x="56" y="72"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="16" font-weight="400" fill="#8b949e">
      Accuracy & speed vs. 7 competitors
    </text>
  </g>

  <line x1="64" y1="112" x2="480" y2="112" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4"/>
</svg>