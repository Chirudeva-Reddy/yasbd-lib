<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">yasbd-lib: Smart scissors for text</title>
  <desc id="desc">yasbd-lib hero: project name, tagline, 98.9% accuracy proof, and first command example</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="cutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7813a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="24" height="24">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5"/>
    </pattern>
    <clipPath id="terminalClip">
      <rect x="0" y="0" width="520" height="280" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- Left: Title block -->
  <g id="title-block" transform="translate(64 48)">
    <!-- Category -->
    <text x="0" y="0"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" font-weight="600"
          fill="#8b949e" letter-spacing="1.5" text-transform="uppercase">
      Sentence Boundary Detector
    </text>

    <!-- Name -->
    <text x="0" y="42"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="52" font-weight="800"
          fill="#e6edf3">
      <tspan fill="url(#accentGrad)">yasbd</tspan>-lib
    </text>

    <!-- Tagline -->
    <text x="0" y="94"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="20" font-weight="400"
          fill="#8b949e">
      Smart scissors for text — precise boundary detection across 39 languages
    </text>

    <!-- Metadata badges row -->
    <g transform="translate(0 136)">
      <g class="badge" transform="translate(0 0)">
        <rect x="0" y="0" width="118" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="59" y="19"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">
          98.9% Acc
        </text>
      </g>
      <g class="badge" transform="translate(128 0)">
        <rect x="0" y="0" width="92" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="46" y="19"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">
          F1 99.7%
        </text>
      </g>
      <g class="badge" transform="translate(230 0)">
        <rect x="0" y="0" width="80" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="40" y="19"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">
          8× faster
        </text>
      </g>
      <g class="badge" transform="translate(320 0)">
        <rect x="0" y="0" width="72" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="36" y="19"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">
          39 langs
        </text>
      </g>
    </g>

    <!-- First action -->
    <g transform="translate(0 192)">
      <text x="0" y="0"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#8b949e">
        $ pip install yasbd-lib
      </text>
      <text x="0" y="28"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="600" fill="#e6edf3">
        > detector.segment("Dr. Smith works here. Is he there?")
      </text>
      <text x="0" y="56"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#8b949e">
        [1] 'Dr. Smith works here.'
      </text>
      <text x="0" y="80"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#8b949e">
        [2] 'Is he there?'
      </text>
    </g>
  </g>

  <!-- Right: Terminal proof / terminal window -->
  <g id="project-proof" transform="translate(640 48)" clip-path="url(#terminalClip)">
    <!-- Terminal window background -->
    <rect width="520" height="280" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

    <!-- Terminal header -->
    <rect width="520" height="36" rx="8 8 0 0" fill="#161b22"/>
    <circle cx="16" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="6" fill="#27c93f"/>

    <!-- Terminal content -->
    <g transform="translate(16 60)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" line-height="1.6">
      <text x="0" y="0" fill="#7ee787">> </text>
      <text x="18" y="0" fill="#e6edf3">detector.segment(</text>
      <text x="126" y="0" fill="#a5d6ff">"Dr. Smith works here. Is he there?"</text>
      <text x="362" y="0" fill="#e6edf3">)</text>

      <text x="0" y="30" fill="#7ee787">> </text>
      <text x="18" y="30" fill="#8b949e">['Dr. Smith works here.', 'Is he there?']</text>

      <text x="0" y="60" fill="#8b949e"># Handles: Dr. Smith ✓  U.S.A. ✓  3.14 ✓  1.2M ✓</text>

      <text x="0" y="90" fill="#7ee787">> </text>
      <text x="18" y="90" fill="#e6edf3">detector.detect(</text>
      <text x="114" y="90" fill="#a5d6ff">"Hello. World."</text>
      <text x="238" y="90" fill="#e6edf3">)</text>

      <text x="0" y="120" fill="#8b949e">[6, 12]  # absolute offsets</text>

      <text x="0" y="150" fill="#7ee787">> </text>
      <text x="18" y="150" fill="#e6edf3">detector.segment(</text>
      <text x="126" y="150" fill="#a5d6ff">"田中さんは完了しました。U.S.A.経済政策は複雑です。"</text>
      <text x="330" y="150" fill="#e6edf3">)</text>

      <text x="0" y="180" fill="#8b949e">['田中さんは完了しました。', 'U.S.A.経済政策は複雑です。']</text>

      <text x="0" y="210" fill="#8b949e"># 39 languages · zero deps · pure Python</text>
    </g>

    <!-- Cut line animation hint -->
    <line x1="260" y1="250" x2="260" y2="280"
          stroke="url(#cutGrad)" stroke-width="2" stroke-dasharray="8,4"
          stroke-linecap="round" opacity="0.6"/>
    <text x="260" y="298"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#8b949e" text-anchor="middle">
      precision cut
    </text>
  </g>

  <!-- Decorative cut marks at corners -->
  <g stroke="url(#cutGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <!-- Top-left -->
    <line x1="24" y1="24" x2="72" y2="24"/>
    <line x1="24" y1="24" x2="24" y2="72"/>
    <!-- Top-right -->
    <line x1="1176" y1="24" x2="1128" y2="24"/>
    <line x1="1176" y1="24" x2="1176" y2="72"/>
    <!-- Bottom-left -->
    <line x1="24" y1="356" x2="72" y2="356"/>
    <line x1="24" y1="356" x2="24" y2="308"/>
    <!-- Bottom-right -->
    <line x1="1176" y1="356" x2="1128" y2="356"/>
    <line x1="1176" y1="356" x2="1176" y2="308"/>
  </g>
</svg>