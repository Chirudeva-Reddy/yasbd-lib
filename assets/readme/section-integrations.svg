<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="180" viewBox="0 0 1200 180"
     role="img" aria-labelledby="title desc">
  <title id="title">Integrations section header</title>
  <desc id="desc">Integrations section header with connected nodes motif</desc>

  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="#0d1117"/>

  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2"/>

  <g transform="translate(64 28)">
    <!-- Connected nodes icon -->
    <g transform="translate(0 14)" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Central node (yasbd) -->
      <circle cx="24" cy="24" r="16" fill="url(#accentGrad)"/>
      <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#0d1117" text-anchor="middle">Y</text>

      <!-- Connected nodes -->
      <g fill="#0d1117" stroke="#30363d" stroke-width="1.5">
        <circle cx="24" cy="24" r="8"/>
        <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#3fb950" text-anchor="middle">Y</text>
      </g>

      <!-- Connections to satellites -->
      <path d="M24 10 L24 0" stroke-width="1.5" stroke-dasharray="4,2"/>
      <circle cx="24" cy="-4" r="6" fill="#3fb950"/>
      <text x="24" y="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6" font-weight="700" fill="#0d1117" text-anchor="middle">spaCy</text>

      <path d="M40 24 L52 24" stroke-width="1.5" stroke-dasharray="4,2"/>
      <circle cx="64" cy="24" r="6" fill="#f7813a"/>
      <text x="64" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6" font-weight="700" fill="#0d1117" text-anchor="middle">OpenMed</text>

      <path d="M24 40 L24 52" stroke-width="1.5" stroke-dasharray="4,2"/>
      <circle cx="24" cy="60" r="6" fill="#a371f7"/>
      <text x="24" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6" font-weight="700" fill="#0d1117" text-anchor="middle">chunklet</text>

      <path d="M10 24 L-2 24" stroke-width="1.5" stroke-dasharray="4,2"/>
      <circle cx="-8" cy="24" r="6" fill="#ff6b35"/>
      <text x="-8" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6" font-weight="700" fill="#0d1117" text-anchor="middle">LiveTranslate</text>

      <path d="M24 24 L8 38" stroke-width="1.5" stroke-dasharray="4,2"/>
      <circle cx="0" cy="46" r="6" fill="#a371f7"/>
      <text x="0" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6" font-weight="700" fill="#0d1117" text-anchor="middle">wyoming</text>
    </g>

    <text x="56" y="30"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="44" font-weight="700" fill="#e6edf3">
      Integrations
    </text>

    <text x="56" y="72"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="19" font-weight="400" fill="#8b949e">
      spaCy, OpenMed, chunklet, LiveTranslate, wyoming_openai
    </text>
  </g>

  <line x1="64" y1="112" x2="640" y2="112" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4"/>
</svg>