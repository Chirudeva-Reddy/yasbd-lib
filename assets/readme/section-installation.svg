<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="180" viewBox="0 0 1200 180"
     role="img" aria-labelledby="title desc">
  <title id="title">Installation section header</title>
  <desc id="desc">Installation section header with download/package motif</desc>

  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="#0d1117"/>

  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2"/>

  <g transform="translate(64 28)">
    <!-- Package box icon -->
    <g transform="translate(0 14)" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 30 L20 18 L40 18 L50 30 L40 42 L20 42 Z" fill="none"/>
      <path d="M20 18 L20 38"/>
      <path d="M10 30 L20 38 L40 38"/>
      <path d="M20 18 L20 2" stroke="#3fb950" stroke-width="2"/>
      <path d="M20 2 L16 -2 M20 2 L24 -2" stroke="#3fb950" stroke-width="2"/>
    </g>

    <text x="56" y="30"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="44" font-weight="700" fill="#e6edf3">
      Installation
    </text>

    <text x="56" y="72"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="19" font-weight="400" fill="#8b949e">
      Quick pip install or build from source
    </text>
  </g>

  <line x1="64" y1="112" x2="440" y2="112" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4"/>
</svg>